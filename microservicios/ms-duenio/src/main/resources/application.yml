spring:
  application:
    name: ms-duenio
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duenio_db}
    username: ${DB_USERNAME:magic}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
