name: Docker Publish

on:
  workflow_call:
    inputs:
      version:
        description: Tag de Git (ej. v1.0.0)
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      image:
        description: Imagen publicada con su tag (ej. docker.io/usuario/vet-system:1.0.0)
        value: ${{ jobs.publish.outputs.image }}

jobs:
  publish:
    name: Build & Push
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular versión de la imagen
        id: version
        run: echo "image=docker.io/${DOCKERHUB_USERNAME}/vet-system:${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./vet-system
          target: runtime
          push: true
          tags: ${{ steps.version.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max