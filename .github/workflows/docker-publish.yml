name: Docker Publish

on:
  workflow_call:
    inputs:
      version:
        description: Tag de Git (ej. v1.0.0)
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  publish:
    name: Build & Push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Calcular versión de la imagen
        id: version
        run: echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./vet-system
          target: runtime
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/vet-system:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max