name: Lint

on:
  workflow_call:

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vet-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar Checkstyle
        run: ./mvnw -B checkstyle:check