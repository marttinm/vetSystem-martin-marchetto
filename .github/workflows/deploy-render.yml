name: Deploy Render

on:
  workflow_call:
    inputs:
      image:
        description: Imagen a desplegar con su tag (ej. docker.io/usuario/vet-system:1.0.0)
        required: true
        type: string
    secrets:
      RENDER_DEPLOY_HOOK:
        required: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Disparar el Deploy Hook con la imagen de la release
        run: |
          curl -fsS -X POST -G "$RENDER_DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ inputs.image }}