spring.application.name=vet-system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vet_system}
spring.datasource.username=${DB_USERNAME:magic}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
server.port=8080

# Logs estructurados en JSON (formato Logstash), con los nombres de campos que pide el TP
spring.main.banner-mode=off
logging.structured.format.console=logstash
logging.structured.json.rename[@timestamp]=timestamp
logging.structured.json.exclude=@version,level_value

# Metricas HTTP enviadas por OTLP a la plataforma de monitoreo (Grafana Cloud)
# Si no se define OTLP_METRICS_ENABLED el envio queda apagado, por ejemplo en CI
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.headers.Authorization=${OTLP_METRICS_AUTH:}
management.otlp.metrics.export.step=30s
# Histograma de tiempos de respuesta para calcular p50 y p95
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
