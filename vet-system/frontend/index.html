<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinica Veterinaria 'Patitas Felices'</title>

    <!-- Bootstrap 5 via CDN, no se instala nada -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ===== Navbar con el nombre de la clinica ===== -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🐾 Clinica Veterinaria 'Patitas Felices'</span>
        </div>
    </nav>

    <div class="container">

        <!-- Zona de alertas (errores / exitos) -->
        <div id="alerta" class="alert d-none" role="alert"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="m-0">Duenios registrados</h2>
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevoDuenio">
                + Nuevo Duenio
            </button>
        </div>

        <!-- ===== Tabla de duenios ===== -->
        <div class="table-responsive">
            <table class="table table-striped table-hover bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>DNI</th>
                        <th>Telefono</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="tablaDuenios">
                    <!-- Filas cargadas por JS con fetch GET /api/duenios -->
                </tbody>
            </table>
        </div>
        <p id="sinDatos" class="text-muted d-none">No hay duenios registrados todavia.</p>
    </div>

    <!-- ===== Modal con el formulario de alta ===== -->
    <div class="modal fade" id="modalNuevoDuenio" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formDuenio">
                    <div class="modal-header">
                        <h5 class="modal-title">Registrar nuevo duenio</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre">
                        </div>
                        <div class="mb-3">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="apellido">
                        </div>
                        <div class="mb-3">
                            <label for="dni" class="form-label">DNI</label>
                            <input type="text" class="form-control" id="dni" placeholder="Entre 7 y 8 digitos">
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Telefono</label>
                            <input type="number" class="form-control" id="telefono">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="text" class="form-control" id="email">
                        </div>

                        <!-- Error del formulario: se muestra el mensaje del ErrorResponse -->
                        <div id="errorForm" class="alert alert-danger d-none mb-0" role="alert"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS (necesario para el modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ===== Logica de la pagina: JS vanilla + Fetch API ===== -->
    <script>
        // El frontend corre en otro origen (Live Server :5500), por eso hace falta CORS en Spring
        const API_BASE = "http://localhost:8080";
        const URL_DUENIOS = API_BASE + "/api/duenios";

        const tabla = document.getElementById("tablaDuenios");
        const sinDatos = document.getElementById("sinDatos");
        const alerta = document.getElementById("alerta");
        const errorForm = document.getElementById("errorForm");
        const form = document.getElementById("formDuenio");
        const modalEl = document.getElementById("modalNuevoDuenio");

        function mostrarAlerta(mensaje, tipo) {
            alerta.textContent = mensaje;
            alerta.className = "alert alert-" + tipo;
        }

        // ---- GET: cargar la tabla de duenios ----
        async function cargarDuenios() {
            try {
                const respuesta = await fetch(URL_DUENIOS);
                if (!respuesta.ok) {
                    throw new Error(await extraerMensajeError(respuesta));
                }
                pintarTabla(await respuesta.json());
            } catch (error) {
                mostrarAlerta("No se pudieron cargar los duenios: " + error.message, "danger");
            }
        }

        function pintarTabla(duenios) {
            tabla.innerHTML = "";
            sinDatos.classList.toggle("d-none", duenios.length > 0);
            duenios.forEach(d => {
                const fila = document.createElement("tr");
                [d.id, d.nombre, d.apellido, d.dni, d.telefono, d.email].forEach(valor => {
                    const celda = document.createElement("td");
                    celda.textContent = valor ?? "";
                    fila.appendChild(celda);
                });
                tabla.appendChild(fila);
            });
        }

        // ---- POST: crear un duenio nuevo ----
        form.addEventListener("submit", async (evento) => {
            evento.preventDefault();
            errorForm.classList.add("d-none");

            const telefono = document.getElementById("telefono").value;
            const nuevoDuenio = {
                nombre: document.getElementById("nombre").value.trim(),
                apellido: document.getElementById("apellido").value.trim(),
                dni: document.getElementById("dni").value.trim(),
                telefono: telefono ? Number(telefono) : null,
                email: document.getElementById("email").value.trim()
            };

            try {
                const respuesta = await fetch(URL_DUENIOS, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(nuevoDuenio)
                });

                if (respuesta.ok) {
                    // Exito: cerrar el modal, limpiar el form y recargar la tabla sin refrescar la pagina
                    bootstrap.Modal.getInstance(modalEl).hide();
                    form.reset();
                    mostrarAlerta("Duenio creado correctamente.", "success");
                    await cargarDuenios();
                } else {
                    // 4xx / 5xx: mostrar el mensaje del ErrorResponse debajo del formulario
                    errorForm.textContent = await extraerMensajeError(respuesta);
                    errorForm.classList.remove("d-none");
                }
            } catch (error) {
                errorForm.textContent = "Error de conexion con la API: " + error.message;
                errorForm.classList.remove("d-none");
            }
        });

        // Toma el campo "mensaje" del ErrorResponse; si la respuesta no es JSON muestra el codigo HTTP
        async function extraerMensajeError(respuesta) {
            try {
                const cuerpo = await respuesta.json();
                return cuerpo.mensaje || ("Error " + respuesta.status);
            } catch (e) {
                return "El servidor respondio con estado " + respuesta.status;
            }
        }

        // Limpiar el error cada vez que se abre el modal
        modalEl.addEventListener("show.bs.modal", () => errorForm.classList.add("d-none"));

        // Al cargar la pagina: poblar la tabla
        document.addEventListener("DOMContentLoaded", cargarDuenios);
    </script>
</body>
</html>
