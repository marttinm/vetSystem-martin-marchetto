spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/turno_db}
    username: ${DB_USERNAME:magic}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: basic
      compression:
        request:
          enabled: true
        response:
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ms-turno
    description: Microservicio de gestion de turnos - Patitas Felices
    version: 1.0.0

logging:
  level:
    com.vetSystem.turno.adapter.out.feign: DEBUG

resilience4j:
  # El Circuit Breaker envuelve al Retry: con el circuito abierto se responde enseguida, sin reintentar
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      mascotaService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
      veterinarioService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
  retry:
    retryAspectOrder: 2
    instances:
      mascotaService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      veterinarioService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
