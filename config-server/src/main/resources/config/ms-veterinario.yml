spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/veterinario_db}
    username: ${DB_USERNAME:magic}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ms-veterinario
    description: Microservicio de gestion de veterinarios - Patitas Felices
    version: 1.0.0
